<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b121c">
<title>Flashcard Kanji — JFT-Basic A2</title>
<style>
  :root{
    --bg:#0b121c;
    --surface-front:#172336;
    --surface-back:#12232a;
    --ink:#f3ead6;
    --ink-dim:#cdd8e6;
    --ink-muted:#8fa0b8;
    --accent:#dba43c;
    --accent-soft:rgba(219,164,60,0.18);
    --accent-glow:rgba(219,164,60,0.45);
    --border:#263b52;
    --n5:#6fb98f;
    --n5-soft:rgba(111,185,143,0.15);
    --n5-border:rgba(111,185,143,0.4);
    --n3:#9b8cf0;
    --n3-soft:rgba(155,140,240,0.15);
    --n3-border:rgba(155,140,240,0.4);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% -10%, #142236 0%, var(--bg) 55%);
    color:var(--ink-dim);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior-y:contain;
  }

  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    width:100%;
    position:relative;
  }

  .progress-track{ height:3px; width:100%; background:rgba(255,255,255,0.06); }
  .progress-fill{
    height:100%;
    width:3.33%;
    background:linear-gradient(90deg, var(--accent), #f3c46b);
    transition:width .4s ease;
  }

  .app-header{ text-align:center; padding:22px 20px 6px; }
  .app-header h1{ margin:0; font-size:1.25rem; font-weight:600; color:var(--ink); letter-spacing:.2px; }
  .app-sub{ margin:4px 0 0; font-size:.8rem; color:var(--ink-muted); }
  .app-credit{ margin:7px 0 0; font-size:.64rem; color:var(--ink-muted); opacity:.55; letter-spacing:.5px; }

  .stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:10px 22px; }
  .card-scene{ width:100%; max-width:360px; perspective:1400px; }

  .card{
    position:relative;
    width:100%;
    height:clamp(320px, 60vh, 480px);
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
    outline:none;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card:focus-visible{ box-shadow:0 0 0 2px var(--accent); border-radius:22px; }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:22px;
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 22px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,.6);
    transition:box-shadow .6s ease;
  }
  .card.glow .card-face{
    box-shadow:0 0 0 2px var(--accent-glow), 0 18px 40px -14px rgba(219,164,60,.35);
  }

  .card-front{ background:var(--surface-front); }
  .card-back{
    background:var(--surface-back);
    transform:rotateY(180deg);
    overflow-y:auto;
    justify-content:flex-start;
    padding-top:46px;
  }

  .kanji-char{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
    font-size:clamp(4.5rem, 24vw, 7.5rem);
    color:var(--ink);
    line-height:1;
    user-select:none;
  }

  .tap-hint{ margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .tap-ripple{ width:12px; height:12px; border-radius:50%; border:2px solid var(--accent); }
  .tap-text{ font-size:.78rem; color:var(--ink-muted); letter-spacing:.2px; }
  @keyframes ripple{
    0%{ box-shadow:0 0 0 0 var(--accent-soft); opacity:1; }
    70%{ box-shadow:0 0 0 14px transparent; opacity:.4; }
    100%{ box-shadow:0 0 0 14px transparent; opacity:0; }
  }
  .tap-ripple{ animation:ripple 2.2s ease-out infinite; }

  .level-badge{
    position:absolute;
    top:16px;
    right:16px;
    font-size:.72rem;
    font-weight:600;
    padding:4px 11px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--ink-dim);
  }
  .level-badge.lvl-n5{ background:var(--n5-soft); color:var(--n5); border-color:var(--n5-border); }
  .level-badge.lvl-n4{ background:var(--accent-soft); color:var(--accent); border-color:rgba(219,164,60,.4); }
  .level-badge.lvl-n3{ background:var(--n3-soft); color:var(--n3); border-color:var(--n3-border); }

  .back-content{ width:100%; display:flex; flex-direction:column; gap:16px; }

  .field-label{ display:block; font-size:.7rem; color:var(--ink-muted); margin-bottom:4px; }
  .arti-value{ font-size:1.45rem; font-weight:600; color:var(--ink); }

  .readings{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .reading-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .reading-value{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:1.05rem;
    color:var(--ink-dim);
    text-align:right;
  }

  .example-block{
    background:rgba(255,255,255,.03);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:12px 14px;
  }
  .example-jp{
    margin:0 0 6px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:1rem;
    color:var(--ink);
    line-height:1.55;
  }
  .example-id{ margin:0; font-size:.85rem; color:var(--ink-muted); line-height:1.45; }

  .back-tap-text{ margin-top:16px; font-size:.72rem; color:var(--ink-muted); opacity:.7; }

  .bottom-nav{
    padding:10px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, transparent, rgba(11,18,28,.9) 30%);
  }
  .card-counter{
    text-align:center;
    margin:0 0 10px;
    font-size:.85rem;
    color:var(--ink-muted);
    font-variant-numeric:tabular-nums;
  }
  .nav-buttons{ display:flex; gap:8px; }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:var(--surface-front);
    border:1px solid var(--border);
    color:var(--ink-dim);
    border-radius:14px;
    padding:10px 4px 8px;
    font-size:.72rem;
    font-family:inherit;
    line-height:1.2;
  }
  .nav-btn:active{ background:var(--accent-soft); border-color:var(--accent); color:var(--ink); transform:scale(.97); }
  .nav-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .nav-icon{ width:20px; height:20px; }
  .btn-sub{ font-size:.62rem; color:var(--ink-muted); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    .tap-ripple{ animation:none; }
    .progress-fill{ transition:none; }
    .nav-btn:active{ transform:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <header class="app-header">
    <h1>Flashcard Kanji</h1>
    <p class="app-sub">Persiapan JFT-Basic A2 &middot; N5–N4 + ekstra N3</p>
    <p class="app-credit">By.fthrrzl</p>
  </header>

  <main class="stage">
    <div class="card-scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Kartu kanji, ketuk atau tekan Enter untuk membalik">
        <div class="card-face card-front">
          <span class="kanji-char" id="kanjiChar" lang="ja"></span>
          <div class="tap-hint">
            <span class="tap-ripple" aria-hidden="true"></span>
            <span class="tap-text">Ketuk untuk membalik</span>
          </div>
        </div>
        <div class="card-face card-back">
          <span class="level-badge" id="levelBadge"></span>
          <div class="back-content">
            <div class="field">
              <span class="field-label">Arti</span>
              <span class="arti-value" id="artiValue"></span>
            </div>
            <div class="readings">
              <div class="reading-row">
                <span class="field-label">On&rsquo;yomi</span>
                <span class="reading-value" id="onyomiValue" lang="ja"></span>
              </div>
              <div class="reading-row">
                <span class="field-label">Kun&rsquo;yomi</span>
                <span class="reading-value" id="kunyomiValue" lang="ja"></span>
              </div>
            </div>
            <div class="example-block">
              <p class="example-jp" id="exampleJp" lang="ja"></p>
              <p class="example-id" id="exampleId"></p>
            </div>
          </div>
          <span class="back-tap-text">Ketuk untuk kembali</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="bottom-nav">
    <p class="card-counter" id="cardCounter" aria-live="polite">1 / 400</p>
    <div class="nav-buttons">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Kartu sebelumnya">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">Sebelumnya</span>
      </button>
      <button type="button" class="nav-btn shuffle-btn" id="shuffleBtn" aria-label="Acak urutan kartu">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        <span class="btn-label">Acak</span>
        <span class="btn-sub">(Shuffle)</span>
      </button>
      <button type="button" class="nav-btn" id="nextBtn" aria-label="Kartu berikutnya">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">Berikutnya</span>
      </button>
    </div>
  </footer>
</div>

<script>

  var shuffleBtn = document.getElementById("shuffleBtn");

  function render(){
    var idx = order[currentPos];
    var data = kanjiData[idx];

    kanjiCharEl.textContent = data.kanji;
    levelBadgeEl.textContent = data.level;
    levelBadgeEl.className = "level-badge " + (data.level === "N5" ? "lvl-n5" : data.level === "N4" ? "lvl-n4" : "lvl-n3");
    artiValueEl.textContent = data.arti;
    onyomiValueEl.textContent = data.onyomi;
    kunyomiValueEl.textContent = data.kunyomi;
    exampleJpEl.textContent = data.exampleJp;
    exampleIdEl.textContent = data.exampleId;
    counterEl.textContent = (currentPos + 1) + " / " + kanjiData.length;
    progressFillEl.style.width = (((currentPos + 1) / kanjiData.length) * 100) + "%";
  }

  function setFlipped(v){
    flipped = v;
    cardEl.classList.toggle("flipped", flipped);
  }

  function triggerGlow(){
    cardEl.classList.add("glow");
    window.setTimeout(function(){ cardEl.classList.remove("glow"); }, 650);
  }

  function goTo(pos){
    var len = order.length;
    currentPos = ((pos % len) + len) % len;
    setFlipped(false);
    render();
  }

  function toggleFlip(){
    setFlipped(!flipped);
    triggerGlow();
  }

  cardEl.addEventListener("click", toggleFlip);
  cardEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
      e.preventDefault();
      toggleFlip();
    }
  });

  prevBtn.addEventListener("click", function(){ goTo(currentPos - 1); });
  nextBtn.addEventListener("click", function(){ goTo(currentPos + 1); });
  shuffleBtn.addEventListener("click", function(){
    for (var i = order.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i];
      order[i] = order[j];
      order[j] = tmp;
    }
    goTo(0);
  });

  render();
})();
</script>
</body>
</html>
